<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="/main.css">
</head>
<body>
    <div>
    <h1>Formulário</h1>
    <form id="meuFormulario">
        <input id="campoA" type="number" required placeholder="Insira um valor no campo A "/>
        <br/>
        <input id="campoB" type="number" required placeholder="Insira um valor no campo B"/>
        <br/>
        <button type="submit">Enviar</button>
        <p class="form-valid"></p>
        <p class="form-invalid"></p>
    </form>
    </div>
    <script src="/main.js"></script>
</body>
</html>
