<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário De Cadastro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <style>

        body{
            background-color: lightslategray;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }

        h1{
            text-align: center;
            color: white;
            margin-bottom: 24px;
        }

        #button{
            margin-top: 4%;
            width: 100%;
            background-color: mediumblue;
            border: none;
            font-weight: bold;
        }

        .row{
        background-color: royalblue;
        border: 1px solid black;
        border-radius: 10px;
        padding: 2rem;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 0 10px rgba(0,0,0,0.3);
            }

            #tel, #email, #nome{
                margin-bottom: 5%;
                
            }

            label {
                font-weight: bold;
                color: white;
            }
            
            #button:hover {
        background-color: darkblue;
            }

    </style>
</head>
<body> 
    <div class="row">
        <div class="col">
        <h1>Cadastro</h1>
        <form>
            <label class="form-label"  for="nome">Seu nome:</label>
            <input id="nome" class="form-control" type="text" required>
            <label class="form-label" for="email">Seu email:</label>
            <input id="email" class="form-control" type="email" required>
            <label class="form-label" for="telefone">Seu telefone:</label>
            <input id="tel" class="form-control " type="tel" required>
            <button id="button" class="btn btn-success" >Enviar</button>
        </form>
        </div>
    </div>
</body>
</html>
